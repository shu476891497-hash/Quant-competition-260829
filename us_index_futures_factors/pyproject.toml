[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "us-index-futures-factors"
version = "1.0.0"
description = "Point-in-time-conscious research pipeline for US index futures factors"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=14",
  "requests>=2.31",
  "scipy>=1.11",
  "statsmodels>=0.14",
  "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.setuptools.packages.find]
include = ["futures_factors*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
